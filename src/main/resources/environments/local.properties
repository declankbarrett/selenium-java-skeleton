# Local development environment
# All environments point at the public Sauce Demo app so the framework runs out of the box.
# Replace baseUrl with your application's URL for this environment.
baseUrl=https://www.saucedemo.com
browser=chrome
timeout=10
headless=false

# Demo credentials (use a secrets store / env variables for real projects)
username=standard_user
password=secret_sauce

# Test Application (Users/Projects) - used by the @search features
appBaseUrl=http://localhost:8081
apiUrl=http://localhost:8080
